# theme-radar 설정 (docs/09 §4.7)
# 이 PC에만 해당하는 값이나 개인 값은 config.local.toml(git 제외)에 같은 형식으로 적는다. 같은 키를 덮어쓴다.

[db]
# 프로젝트 루트 기준 상대 경로 또는 절대 경로
path = "data/theme_radar.sqlite3"
busy_timeout_ms = 30000

[collect]
start_date = "2025-01-01"          # 수집 시작일 (docs/07 R-2)
raw_dir = "data/raw/prices"        # 수집 원문 (git 제외)
cache_dir = "data/cache"           # yfinance 캐시 (git 제외)

[http]
# 네이버·Daum·KIND·위키백과 직접 호출 (docs/07 §10.2~10.3)
browser_user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
timeout_s = 30
retries = 4
max_workers = 4
rate_per_s = 5                     # 호스트마다 초당 요청 수

[sec]
user_agent = ""                    # config.local.toml에 "theme-radar 연락처이메일" 형식으로 적는다
rate_per_s = 8                     # SEC 정책 상한 10

[kr]
excluded_funds = ["088980", "415640", "094800"]   # 인프라·부동산 펀드 (docs/07 §7.1)
shares_history_from = "2026-03-09"                # FDR KRX 스냅샷으로 상장주식수를 얻는 첫 거래일 (docs/07 §7.4)

[checks]
share_change_threshold = 0.05      # SHARE_CHANGE 특이사항 임계값 (docs/07 §11.2)
